<script>

addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')hide();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
(function(){const v=document.getElementById('film-player'),sec=document.getElementById('film'),hint=document.getElementById('film-hint');if(!v||!sec)return;let locked=false,done=false;const html=document.documentElement;const block=e=>{if(locked){e.preventDefault();}};const keys=['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '];const kb=e=>{if(locked&&keys.includes(e.key))e.preventDefault();};
function lock(){if(locked||done)return;locked=true;window.scrollTo({top:sec.offsetTop,behavior:'smooth'});html.classList.add('film-locked');window.addEventListener('wheel',block,{passive:false});window.addEventListener('touchmove',block,{passive:false});window.addEventListener('keydown',kb);v.currentTime=0;v.muted=false;v.volume=1;v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});if(hint)hint.hidden=false;const un=()=>{v.muted=false;if(hint)hint.hidden=true;window.removeEventListener('pointerdown',un);window.removeEventListener('keydown',un);};window.addEventListener('pointerdown',un);window.addEventListener('keydown',un);});}
function unlock(){locked=false;done=true;html.classList.remove('film-locked');window.removeEventListener('wheel',block);window.removeEventListener('touchmove',block);window.removeEventListener('keydown',kb);if(hint)hint.hidden=true;}
v.addEventListener('ended',unlock);v.addEventListener('error',unlock);
new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting&&x.intersectionRatio>=0.45)lock();}),{threshold:[0.45]}).observe(sec);
v.addEventListener('click',()=>{if(done){if(v.paused){v.muted=false;v.play();}else v.pause();}});})();document.querySelectorAll('.player').forEach(p=>{const fp=p.querySelector('video'),fb=p.querySelector('.play');if(!fp||!fb)return;fb.addEventListener('click',()=>{fp.play()});fp.addEventListener('play',()=>fb.hidden=true);fp.addEventListener('pause',()=>fb.hidden=false);fp.addEventListener('ended',()=>fb.hidden=false)});

const EN=window.WH_EN||{},FR={};for(const k in EN)FR[EN[k]]=k;
const nodes=[];(function walk(n){for(const c of n.childNodes){if(c.nodeType===3){if(c.nodeValue.trim())nodes.push(c)}else if(c.nodeType===1&&!['SCRIPT','STYLE'].includes(c.tagName))walk(c)}})(document.body);
function setLang(l){const map=l==='en'?EN:FR;nodes.forEach(n=>{const raw=n.nodeValue,t=raw.trim();if(map[t]!==undefined)n.nodeValue=raw.replace(t,map[t])});document.querySelectorAll('[alt],[aria-label],[placeholder]').forEach(e=>{for(const a of ['alt','aria-label','placeholder']){const v=e.getAttribute(a);if(v&&map[v])e.setAttribute(a,map[v])}});
  document.documentElement.lang=l;document.dispatchEvent(new CustomEvent('wh:lang',{detail:l}));try{localStorage.setItem('wh-lang',l)}catch(e){}}
document.getElementById('lang-fr').onclick=()=>{try{localStorage.setItem('wh-lang','fr')}catch(e){}};
try{localStorage.setItem('wh-lang','en')}catch(e){}

<script>
(()=>{const mos=[...document.querySelectorAll('.adv .mo')],ims=[...document.querySelectorAll('.adv-media picture')];if(!mos.length)return;let cur=-1,hover=false;

let t=0;addEventListener('scroll',()=>{if(t)return;t=setTimeout(()=>{t=0;pick()},80)},{passive:true});addEventListener('resize',pick);
