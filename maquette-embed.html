<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette 3D — Williams &amp; Harper</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
/* Version intégrable de la maquette (boutique Shopify) : sans en-tête ni pied de page */
html,body{margin:0;background:#f7f5f0}
body{padding:0}
.embed{padding:0}
.embed .m3d-tabs{margin:0 0 .8rem}
.embed .m3d{aspect-ratio:auto;height:calc(100vh - 4.2rem);min-height:320px}
</style>
<script type="importmap">{"imports":{"three":"./js/vendor/three.module.min.js"}}</script>
</head>
<body>
<main class="embed">
  <div class="m3d-tabs" role="group" aria-label="Choisir une villa"><button type="button" data-villa="chloe" aria-pressed="true">Villa Chloé</button><button type="button" data-villa="celine" aria-pressed="false">Villa Céline</button><button type="button" data-villa="margaux" aria-pressed="false">Villa Margaux</button></div>
  <div class="m3d m3d-page" data-model="chloe" data-manual>
    <div class="m3d-ui" role="group" aria-label="Vues de la maquette"><button type="button" data-view="all" aria-pressed="true">Volumes</button><button type="button" data-view="rdc" aria-pressed="false">Rez-de-chaussée</button><button type="button" data-view="etage" aria-pressed="false">Étage</button><button type="button" data-night aria-pressed="false" class="m3d-night">Nuit</button><button type="button" data-vr aria-pressed="false" class="m3d-vr" hidden>Entrer en VR</button><button type="button" data-reset class="m3d-reset" aria-label="Recentrer">↻</button></div>
    <noscript><p class="note">La maquette interactive nécessite JavaScript.</p></noscript>
  </div>
</main>
<script type="module">
import { mount } from './js/villa3d.js';
const box = document.querySelector('.m3d-page');
let cur = mount(box);
document.querySelectorAll('.m3d-tabs [data-villa]').forEach((b) => b.addEventListener('click', () => {
  if (b.disabled || b.getAttribute('aria-pressed') === 'true') return;
  document.querySelectorAll('.m3d-tabs [data-villa]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  cur && cur.dispose(); box.dataset.model = b.dataset.villa; cur = mount(box);
  box.querySelectorAll('[data-view]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.view === 'all'));
  
}));
</script>
</body>
</html>
